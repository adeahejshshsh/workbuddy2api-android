name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + checksums）
# 固化的发布纪律（曾两次人祸，见仓库 HANDOFF）：-s -w 剥离、二进制版本串 == 源码
# appVersion、tag 版本 == 源码版本（-ci 后缀的测试 tag 豁免，用于演练发布线）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 版本号唯一来源是仓库根 VERSION（与 rebuild.sh / build_apk.sh 同源）。
      # 之前是 grep main.go 里的 appVersion —— 那个值现在是 "dev"（真版本靠
      # -ldflags -X 注入），断言必然失败、Release 永远建不出来。
      - name: 取版本号与 Go 模块目录
        id: ver
        run: |
          # 三级回落：仓库根 VERSION → 子目录 VERSION → git describe。
          # 都取不到就**明确失败**（bug A1）：以前回落成 "dev"，于是
          #   · -X main.appVersion=dev 等于没注入；
          #   · 断言 grep "dev" 在二进制里到处命中 → 假绿；
          #   · publish 阶段 TAG(1.28.1) != SRC(dev) → 任何 tag 都发不出 Release。
          V=$(cat VERSION 2>/dev/null || cat workbuddy2api-panel/VERSION 2>/dev/null \
              || git describe --tags --abbrev=0 2>/dev/null || true)
          V="${V#v}"
          if [ -z "$V" ] || [ "$V" = dev ]; then
            echo "::error::取不到版本号（仓库根 VERSION 缺失且无可用 tag），拒绝用 dev 继续"
            exit 1
          fi
          if [ -f go.mod ]; then D="."; else D="workbuddy2api-panel"; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "版本号 $V，模块目录 $D"

      - name: 构建（剥离符号 + 注入版本，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        working-directory: ${{ steps.ver.outputs.dir }}
        run: go build -ldflags "-s -w -X main.appVersion=${{ steps.ver.outputs.v }}" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含源码 appVersion（防交叉编译矩阵里编错树/漏 ldflags）
      # working-directory 必须与构建步一致（bug A2）：产物写在 ${{ steps.ver.outputs.dir }}，
      # 断言/打包若在仓库根执行，产物不在 cwd → grep 报 No such file、zip/tar 也找不到文件。
      - name: 断言二进制版本串
        working-directory: ${{ steps.ver.outputs.dir }}
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        working-directory: ${{ steps.ver.outputs.dir }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          V="${V%-panel}"   # 文件名不带 -panel 后缀（wb2api-panel-v1.2.3-... 既有惯例）
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      # uses 步骤没有 working-directory，路径要显式带上模块目录（bug A2）
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ steps.ver.outputs.dir }}/${{ env.name }}
          retention-days: 7

  # 仅 tag 触发：校验 tag == 源码版本（-ci 演练 tag 豁免）→ 汇总资产 → 建 Release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取历史 tag 算 compare 链接
      - name: tag 与源码版本一致性断言
        run: |
          # 版本唯一来源：仓库根 VERSION（不要再从 main.go 里 grep —— 那里是 "dev"）。
          # 与 build 阶段同口径的三级回落 + 明确失败（bug A1）：回落到 "dev" 会让
          # 一致性断言永远不等，任何非 -ci tag 都发不出 Release。
          SRC=$(cat VERSION 2>/dev/null || cat workbuddy2api-panel/VERSION 2>/dev/null \
                || git describe --tags --abbrev=0 2>/dev/null || true)
          SRC="${SRC#v}"
          if [ -z "$SRC" ] || [ "$SRC" = dev ]; then
            echo "::error::取不到源码版本号（仓库根 VERSION 缺失），拒绝建 Release"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与源码 appVersion=$SRC 不一致（先提交版本号再打 tag）"
              exit 1
            fi
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}-panel
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            CI 自动构建发布（五平台二进制 + checksums）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ github.ref_name }}
          files: dist/*
