name: ci

# 门禁跟随上游 `binaries.yml` 的口径（2026-10-30 上游 `b2df95d`）：
#   - 触发面：pull_request + push(main, v*) + workflow_dispatch
#     （上游原话：「此前只有 push/tag 触发，等于合并前零门禁，坏代码合进 main 才第一次跑 go test」）
#   - 唯一门禁步骤就是 `go test ./...`，Go 版本跟 go.mod（不发散成自定义矩阵）
#
# 与上游的两处差异，都是本仓形态决定的：
#   - 模块根在 workbuddy2api-panel/（仓库根是 APK 打包工作区）→ working-directory
#   - 不发版：我们的产物是本地签名 APK（走 Release 手工发），上游那套
#     windows/linux/darwin × amd64/arm64 交叉编译 + gh release create 在这里没有对应物。
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# W6-M-08：不给权限就是给默认权限 —— 仓库默认的 GITHUB_TOKEN 在旧仓设置下可能是
# read/write，一条被投毒的测试依赖就能用它对 main 推提交、改 Release。
# 这个 job 只读代码跑 go test，最小权限就是 contents: read。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workbuddy2api-panel
    steps:
      # 版本一律写全 major tag（@v4 / @v5），不用 @main 这类浮动引用：
      # 浮动引用等于把「跑什么代码」交给上游随时改。
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 后续步骤不需要 git 凭据，别把它留在 .git/config 里

      - uses: actions/setup-go@v5
        with:
          go-version-file: workbuddy2api-panel/go.mod
          cache-dependency-path: workbuddy2api-panel/go.sum

      - name: test
        run: go test ./...

      # 出站头与官方真机夹具对拍（默认跳过，这里显式开启作门禁）。
      # 夹具是 WorkBuddy 桌面端真机抓包原文；任何头名/值/大小写/顺序漂移都会红。
      # 改夹具必须同时说明抓包依据，否则等于自己给自己放水。
      #
      # 2026-11-01 接进来之前先清了 7 处差异（chat）与 34→8（/v2/chat/busy）——
      # 先落量具、再清差异、最后才上门禁。红门禁进 main 只会逼着以后绕开 CI。
      - name: official-head parity
        run: WB2A_PARITY=1 go test ./internal/upstream -run TestOfficialParity -v
